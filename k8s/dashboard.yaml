apiVersion: apps/v1
kind: Deployment
metadata:
  name: cata-dashboard
  labels:
    app: cata-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cata-dashboard
  template:
    metadata:
      labels:
        app: cata-dashboard
    spec:
      containers:
        - name: dashboard
          image: cata-dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://cata-api-service/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: cata-dashboard-service
spec:
  selector:
    app: cata-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
