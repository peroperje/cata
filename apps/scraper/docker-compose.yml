version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  scraper:
    build: .
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://host.docker.internal:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
