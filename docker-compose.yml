services:
  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: cata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cata_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cata_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cata-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: cata-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cata_db}
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - cata-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Redis for Scraper
  redis:
    image: redis:alpine
    container_name: cata-redis
    ports:
      - "6379:6379"
    networks:
      - cata-network

  # Job Scraper
  scraper:
    build:
      context: ./apps/scraper
      dockerfile: Dockerfile
    container_name: cata-scraper
    depends_on:
      - redis
      - api
    environment:
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://api:8000/api/v1
    volumes:
      - ./apps/scraper:/app
    networks:
      - cata-network

volumes:
  cata_postgres_data:


networks:
  cata-network:
    driver: bridge
