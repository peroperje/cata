version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cata-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cata_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cata_password}
      POSTGRES_DB: ${POSTGRES_DB:-cata_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cata_user}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cata-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: cata-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cata_user}:${POSTGRES_PASSWORD:-cata_password}@postgres:5432/${POSTGRES_DB:-cata_db}
      PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    networks:
      - cata-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:


networks:
  cata-network:
    driver: bridge
